syntax = "proto3";

package polyclinic.generator.protos;
option csharp_namespace = "Polyclinic.Application.Contracts.Protos";

import "google/protobuf/empty.proto";

service PatientGrpcService {
  rpc PatientGetStream(google.protobuf.Empty) returns (stream PatientListResponse);
}

message PatientListResponse {
  repeated PatientResponse patients = 1;
  bool is_final = 2;
}

message PatientResponse {
  int32 id = 1;
  string full_name = 2;
  string passport_number = 3;
  string address = 4;
  string phone = 5;
  string birth_date = 6;
}