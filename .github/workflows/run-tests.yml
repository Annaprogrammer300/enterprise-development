name: .NET Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Polyclinic/Polyclinic.sln

    - name: Build solution
      run: dotnet build Polyclinic/Polyclinic.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test Polyclinic.Tests/Polyclinic.Domain.csproj --no-build --configuration Release